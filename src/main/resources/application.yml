# 공통 설정 (모든 프로필에 적용)
# 프로필별 설정은 application-{profile}.yml 에서 덮어쓴다.

spring:
  application:
    name: deploy
  profiles:
    # 아무것도 지정하지 않으면 local 로 실행된다.
    # 서버에서는 --spring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.
    default: local

  jpa:
    hibernate:
      # 테이블은 Flyway(db/migration)가 관리한다. JPA는 엔티티와 테이블이 맞는지 검사만 한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
