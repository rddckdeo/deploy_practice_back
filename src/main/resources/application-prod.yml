# 서버(운영) 설정
# DB 접속 정보는 전부 환경 변수로 받는다. 값이 없으면 앱이 시작되지 않는다(기본값 없음).
#   DB_URL       예) jdbc:mysql://localhost:3306/practice_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#   DB_USERNAME
#   DB_PASSWORD

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

server:
  # Nginx 뒤에서 X-Forwarded-* 헤더를 신뢰해 원래 요청 정보(https, host 등)를 사용한다.
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
